# 琉球衝浪基地 Worker（docs/ADMIN_SPEC.md A 期，2026-09-13 起）：
# 前台頁面（Static Assets）＋公開 API（衝浪情報、網站內容）＋之後的後台，都在這一個 Worker。
# 名稱保留 ryukyusurfbase-api：排程與 secrets 都掛在這個 Worker 上，改名會變成另一個 Worker、排程重複跑。
# 這個檔案不放任何憑證。
name = "ryukyusurfbase-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# GitHub Pages 預覽站仍然透過 workers.dev 網址讀 API
workers_dev = true

routes = [{ pattern = "ryukyusurfbase.sssuni.com", custom_domain = true }]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 這些路徑一律先交給 Worker 程式；其他（頁面、圖片）直接由 Static Assets 回應
run_worker_first = ["/api/*", "/admin/api/*", "/telegram/*"]

[triggers]
# 以 UTC 撰寫：
#   10 20,2,8  → JST 05:10／11:10／17:10 抓氣象廳預報
#   15 20      → JST 05:15 發今天的報告
#   15 2       → JST 11:15 發明天的報告
#   0 21 * * 1 → JST 週二 06:00 補抓潮位表年檔
crons = ["10 20,2,8 * * *", "15 20 * * *", "15 2 * * *", "0 21 * * 1"]

[vars]
ALLOWED_ORIGINS = "https://sssunwl.github.io,https://ryukyusurfbase.sssuni.com"
SITE_URL = "https://ryukyusurfbase.sssuni.com"
# 公開頻道的 chat id（例如 @ryukyusurf_channel 或 -100…），頻道建好後由 SS 提供
TELEGRAM_CHANNEL_ID = ""
# 只有 SS 能改成 "true"（SPEC §6.2：要等氣象廳確認＋Open-Meteo 商用方案）
MODEL_LAYER_ENABLED = "false"

# secrets（用 `wrangler secret put` 設定，絕不寫進這個檔案）：
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET

[[d1_databases]]
binding = "DB"
database_name = "ryukyusurfbase"
database_id = "6bc1e581-7a17-44ef-abc0-d5e9b4afc678"

name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -- --mode ghpages

      # 這是給教練看的預覽站，不是正式站：擋搜尋引擎索引。
      # 正式站走 Cloudflare Pages + 自訂網域，不經過這個 workflow，所以不會帶到 noindex。
      - name: Block search engines
        run: |
          sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow" />|' dist/index.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      # GitHub Pages 沒有 SPA fallback，直接開 /about 會 404。
      # 標準解法：把 index.html 複製成 404.html，交給前端 router 接手。
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
